spring.application.name=skill-verification
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/skill_verification?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Scalability: Database Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:25}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080

# Scalability: Embedded Tomcat Concurrency
server.tomcat.threads.max=${SERVER_MAX_THREADS:200}
server.tomcat.threads.min-spare=${SERVER_MIN_THREADS:20}
server.tomcat.max-connections=10000
server.tomcat.accept-count=100

# Upload directory configuration
file.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Application Integration Mode (MOCK or REAL)
app.integration.mode=${INTEGRATION_MODE:REAL}

# JWT Configuration
app.jwt.secret=${JWT_SECRET:this-is-a-placeholder-secret-key-that-should-be-changed-in-production-this-is-a-placeholder-secret-key-that-should-be-changed-in-production}
app.jwt.expiration-ms=86400000

# ONEST / Beckn Configuration
onest.enabled=${ONEST_ENABLED:true}
onest.base-url=${ONEST_BASE_URL:http://localhost:8080/api/bpp}
onest.subscriber-id=${ONEST_SUBSCRIBER_ID:skill-verification-bap.onest.network}
onest.subscriber-uri=${ONEST_SUBSCRIBER_URI:http://localhost:8080/api/beckn}
onest.registry-url=${ONEST_REGISTRY_URL:}

beckn.domain=${BECKN_DOMAIN:onest:work-opportunities}
beckn.gateway-url=${BECKN_GATEWAY_URL:http://localhost:8080/api/bpp}
beckn.bap-id=${BECKN_BAP_ID:skill-verification-bap.onest.network}
beckn.bap-uri=${BECKN_BAP_URI:http://localhost:8080/api/beckn}
beckn.key-id=${BECKN_KEY_ID:key-1}
beckn.private-key=${BECKN_PRIVATE_KEY:}
beckn.public-key=${BECKN_PUBLIC_KEY:}
